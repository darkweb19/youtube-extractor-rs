name: Offline scenario evals

on:
  pull_request:
  push:
    branches: [main, fix/rust-yt-bot]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Test eval reporting and failure handling
        run: python3 -m unittest discover -s evals -p 'test_*.py'
      - name: Evaluate extraction and remote transport scenarios
        run: python3 evals/run.py --out work/evals
      - name: Retain per-case results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval-results
          path: work/evals/
          if-no-files-found: error
          retention-days: 14
