[package]
name = "youtube-extractor"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
description = "Standalone native YouTube metadata and media extraction service"
license = "Apache-2.0"
publish = false

[lib]
name = "youtube_extractor"
path = "src/lib.rs"

[[bin]]
name = "youtube-extractor"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
rusty_ytdl = "=0.7.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
tower = { version = "0.5", features = ["util", "limit", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
