name: GCP remote integration compile and tests
on:
  push:
    branches: [fix/rust-yt-bot]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Validate deployment scripts
        run: bash -n gcp-worker/*.sh
      - name: Check frontend JavaScript syntax
        run: node --check web/app.js
      - name: Run frontend regression tests
        run: node --test tests/frontend/*.test.mjs
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Compile all targets
        run: cargo check --locked --all-targets
      - name: Run regression tests
        run: cargo test --locked --all-targets
