name: yt-dlp extractor branch validation
on:
  push:
    branches: [fix/rust-yt-bot]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rusty-yt-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install FFmpeg for media integration tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - uses: Swatinem/rust-cache@v2
      - name: Verify frontend JavaScript
        run: node --check web/app.js
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Rust test suite
        run: cargo test --locked --all-targets
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag youtube-extractor:rusty .
      - name: Verify yt-dlp and Node.js are installed
        run: |
          docker run --rm --entrypoint /usr/local/bin/yt-dlp youtube-extractor:rusty --version
          docker run --rm --entrypoint /usr/local/bin/node youtube-extractor:rusty --version
      - name: Verify container auth, health, and media tools
        run: IMAGE=youtube-extractor:rusty bash scripts/smoke-container.sh
